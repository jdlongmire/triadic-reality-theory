# Registry of computations whose results the programme relies on.
# Re-run in CI by 0-program-methods/ops/reproduce.py on every push and pull request.
# Rules: 0-program-methods/research-records.md, section 4.
#
# reference_provenance says who produced the reference output and how far it has
# been independently checked. A reference captured from a fresh run is a baseline:
# it proves the computation is stable from then on, and nothing about whether it is
# correct.

computations:
