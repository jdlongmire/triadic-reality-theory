name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs: a burst of pushes to main runs CI once (latest only).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    name: Traceability (schema + acyclic graph + fresh reports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate claims + check dependency graph is acyclic
        run: python3 traceability/scripts/build.py
      - name: Protocol 001 deterministic pilot tests
        working-directory: 05-work-packages/WP-TRT-IIA-AI-0001-engineered-receiver-protocol/pilot
        run: python3 test_pilot.py
      - name: Protocol 001 model-runner adapter smoke test
        working-directory: 05-work-packages/WP-TRT-IIA-AI-0001-engineered-receiver-protocol/model-pilot
        run: |
          python3 model_runner.py --tasks ../pilot/tasks.json --receiver python3 receiver_adapter_example.py --model-id noop --out /tmp/iia-model-smoke
          test "$(($(wc -l < /tmp/iia-model-smoke/runs.csv)-1))" -eq 48
      - name: Generated reports must be fresh (no stale commits)
        run: |
          if ! git diff --quiet traceability/generated; then
            echo "::error::traceability/generated is stale — run build.py and commit the result"
            git diff --stat traceability/generated
            exit 1
          fi

  lean-core:
    name: Lean core typecheck (Mathlib-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan + Lean (pinned by lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          # releases.lean-lang.org intermittently 500s on the toolchain tarball;
          # retry a few times before failing the job.
          for i in 1 2 3; do
            if bash elan-init.sh -y --default-toolchain "$(cat formalization/lean-toolchain)"; then
              break
            fi
            echo "elan toolchain install failed (attempt $i/3)"
            if [ "$i" -lt 3 ]; then sleep 20; fi
          done
          test -x "$HOME/.elan/bin/lean" || { echo "::error::elan toolchain install failed after 3 attempts"; exit 1; }
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Typecheck Core/Primitives.lean (no Mathlib, must have 0 sorry)
        working-directory: formalization
        run: lean TrtFormalization/Core/Primitives.lean

  math-lint:
    name: GitHub MathJax / LaTeX safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject \operatorname in markdown math
        run: |
          # Exclude the vendored LRT sub-project and backtick-wrapped documentation
          # mentions (e.g. the rule in research-practices.md). Real math lines have no backtick.
          HITS=$(grep -rn '\\operatorname' --include='*.md' . | grep -v '/lrt/' | grep -v '`' || true)
          if [ -n "$HITS" ]; then
            echo "::error::\\operatorname found in math — use \\mathrm (see issue #7 / 0-program-methods/research-practices.md)"
            echo "$HITS"
            exit 1
          fi
          echo "OK — no unsupported \\operatorname usage"

      - name: Detect malformed display delimiters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          excluded = {Path("formalization/lrt")}
          errors = []
          checked = 0

          for p in Path(".").rglob("*.md"):
              if any(str(p).startswith(str(x) + "/") for x in excluded):
                  continue
              text = p.read_text(encoding="utf-8")
              checked += 1

              # Fenced math is valid GitHub syntax. Remove it before checking
              # dollar-delimited blocks so its contents cannot create false hits.
              scrubbed = re.sub(r"```math\n.*?\n```", "", text, flags=re.S)

              # A line containing exactly one leading/trailing dollar is the
              # regression that previously exposed raw LaTeX in the README.
              for n, line in enumerate(scrubbed.splitlines(), 1):
                  s = line.strip()
                  if len(s) > 1 and s.startswith("$") and s.endswith("$") and not s.startswith("$") and not s.endswith("$"):
                      # ordinary inline math is allowed when embedded in prose;
                      # flag only a standalone math-looking line.
                      if re.match(r"^\$\\?[A-Za-z{]", s) or "\\" in s:
                          errors.append(f"{p}:{n}: suspicious single-dollar display line: {s}")

              # Display $ delimiters must be balanced in each file.
              if scrubbed.count("$") % 2:
                  errors.append(f"{p}: unbalanced $ display delimiters")

          if errors:
              print("::error::Malformed GitHub math delimiters detected")
              print("\n".join(errors))
              sys.exit(1)
          print(f"OK — audited {checked} Markdown files for malformed display delimiters")
          PY
