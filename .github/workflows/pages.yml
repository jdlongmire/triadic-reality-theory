name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install Pages dependencies
        run: bundle install
      - name: Build site
        run: bundle exec jekyll build --source docs --destination _site
      - name: Verify site contract
        run: |
          test -f _site/index.html
          test -f _site/accessible/index.html
          test -f _site/technical/index.html
          test -f _site/status/index.html
          test -f _site/corpus/index.html
          test -f _site/terminology/index.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          grep -R "tex-svg.js" _site/index.html >/dev/null
          grep -R "chi" docs/index.md >/dev/null
      - name: Verify SEO contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          routes = [
            "_site/index.html",
            "_site/accessible/index.html",
            "_site/technical/index.html",
            "_site/status/index.html",
            "_site/terminology/index.html",
            "_site/corpus/index.html",
          ]
          titles, descriptions, errors = set(), set(), []
          for route in routes:
              text = Path(route).read_text(encoding="utf-8")
              title = re.search(r"<title>(.*?)</title>", text, re.S)
              desc = re.search(r'<meta name="description" content="([^"]+)"', text)
              canon = re.search(r'<link rel="canonical" href="([^"]+)"', text)
              h1s = re.findall(r"<h1[^>]*>", text)
              for label, match in [("title", title), ("description", desc), ("canonical", canon)]:
                  if not match: errors.append(f"{route}: missing {label}")
              if title:
                  if title.group(1) in titles: errors.append(f"{route}: duplicate title")
                  titles.add(title.group(1))
              if desc:
                  if desc.group(1) in descriptions: errors.append(f"{route}: duplicate description")
                  descriptions.add(desc.group(1))
              if len(h1s) != 1: errors.append(f"{route}: expected 1 H1, found {len(h1s)}")
              for required in ['property="og:title"', 'application/ld+json', 'name="robots"']:
                  if required not in text: errors.append(f"{route}: missing {required}")
          if "noindex" in "\n".join(Path(r).read_text(encoding="utf-8").lower() for r in routes):
              errors.append("principal route contains noindex")
          if errors:
              print("\n".join(errors)); sys.exit(1)
          print("SEO contract OK")
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
