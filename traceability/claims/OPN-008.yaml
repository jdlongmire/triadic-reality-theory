  - { doc: ADCE-T3T5, section: "2-theory/04-cosmology/adce-t3t5-report.md" }
risk_if_false: |
  If no growth law solves the coincidence problem without hand-tuning, or the
  mechanism cannot match the fluctuation rival's derived 10^-120 magnitude, or the
  4-volume resolution renders the geometric hypothesis vacuous (static universes
  sustain Ṅ > 0 at saturation, so only *accelerating* actualization carries content
  — adce.md §8 v3.1), or no N_R→N_P bridge law can be stated (adce.md §9.4), ADCE
  reduces to re-labeled causal-set kinematics with no independent content and is
  abandoned (adce.md §16 criteria 11-12, 15-16). The TRT hard core is untouched
  either way; this is a belt-level physics-facing conjecture.
