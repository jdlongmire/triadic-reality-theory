id: OPN-008
name: ADCE — Dark Energy from Mean Causal Growth
statement: |
  Determine whether the mean growth rate of realized causal structure (Ṅ), on the
  causal-set number-volume substrate with an explicit saturation axiom (A-SAT), can
  drive late-time accelerated expansion with (a) a derived growth law producing
  matter-era deceleration followed by acceleration onset at z ≈ 0.7, (b) a natural
  magnitude compatible with the observed dark-energy scale, and (c) a w_A(z)
  distinguishable from both ΛCDM and the fluctuation-driven everpresent-Λ mechanism
  (Λ ~ ±ℏ/√V₄) that shares the same kinematic substrate.
tier: 2
role: open
proof_status: prose_only
epistemic_status: open
depends_on:
  - { claim_id: ONT-001, dependency_type: logical }
  - { claim_id: ACT-001, dependency_type: logical }
  - { claim_id: EXT-002, dependency_type: formal }
source_documents:
