id: ONT-004
name: Synthetic Necessity of the Triad
statement: |
  Given determinate actuality, logical constraint, informational differentiation,
  and action are each necessary. Their necessity is synthetic rather than a
  definitional unpacking: removing L₃ loses coherent determinacy, removing I∞
  loses differentiated content, and removing A loses fundamental transition.
tier: 1
role: primitive
proof_status: prose_only
epistemic_status: argued
depends_on:
  - { claim_id: ONT-002, dependency_type: logical }
source_documents:
  - { doc: TRT-v0.10, section: "3.5, 9" }
risk_if_false: |
  If the necessity follows only from stipulated definitions, or a constituent
  can be removed without loss, the hard-core necessity claim fails.
notes: A is independently characterized as non-temporal state transition/change.
