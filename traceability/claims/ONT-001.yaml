id: ONT-001
name: Canonical R-D-X Architecture
statement: |
  Determinate actuality is modeled by R --(L₃ necessary filter)--> D --(A)--> X/χ.
  R is representable informational content, D is the actualizable domain, and X/χ
  is what obtains. The compact χ = A(I∞ | L₃, ...) is schematic and does not assert
  that L₃ alone exhausts actualizability.
tier: 1
role: primitive
proof_status: prose_only
epistemic_status: argued
formal_artifacts:
  lean:
    - { file: TrtFormalization/Core/Primitives.lean, symbol: Chi, status: axiom }
depends_on:
  - { claim_id: ONT-002, dependency_type: logical }
  - { claim_id: ONT-003, dependency_type: formal }
source_documents:
