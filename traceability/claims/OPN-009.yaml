risk_if_false: >
  If no instrument can implement proposition-dual independent records, or every apparent
  violation is observationally equivalent to a calibrated common-mode failure, the global
  bivalent-closure bridge under FLL remains empirically inaccessible. If a sound implementation
  violates the bound after all auxiliary assumptions survive, the claim that completed actual
  contexts are globally bivalent is refuted and TRT's L3-to-outcome-actual bridge requires revision.
notes: >
  The first-pass WP disposition rejected the submitted null-event classifier and overreached by
  inferring that no positive discriminator could exist. JD's challenge about the global effect of
  the three FLL corrected that
  inference. The candidate witness uses actual meta-records of gaps/gluts; it is not a PRD claim
  until a physical implementation and contrastive rival likelihood exist. The minimal four-valued
  quantum-instrument attempt did not supply one: normalized gap/glut branches are expanded actual
  outcomes, while refusing completion removes a laboratory likelihood. Contextuality provides the
  inequality/polytope method but must not be conflated with FLL failure inside one context. The
  governing objective remains the search for any irreducibly non-bivalent physical informational
  actualization; model representation is subordinate to that falsification programme.
