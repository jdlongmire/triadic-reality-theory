  - { doc: non-bivalent-rival-model-attempt.md, section: "Instrument-completion dichotomy" }
  - { doc: nonactualization-operationalization.md, section: "Stage-2 correction" }
  - { doc: WP-TRT-LCC-0001, section: "Stage-2 Response" }
external_citations:
