notes: |
  The structural parallel between the gravity fork and measurement emerged from the
  relational-graph computation (MEDIUM).
  2026-06-26 (cross-sector exploration; 2-theory/03-gravity/cross-sector-keystone.md):
  examined whether the quantum-sector result (the discriminating einselection criterion
  uses the Hilbert metric) constrains A toward the projective/quadratic horn. A first-pass
  "leans modified gravity" reading was REFUTED by red-team: the metric-using object
  (gamma_dot) is STAGE-1 (co-admissibility; verdict = re-description), not the STAGE-2
  projective Born selection, which born-rule.md §6.6.2 itself leaves underived (the open
  keystone). Corrected result: a CONDITIONAL only — IF the sectors share a value space
  (not just A) AND projective Born is fundamental to A (not a stage-2 overlay), THEN exact
  GR + projective measurement + the unification cannot all hold. Both premises unproven;
  the all-three-consistent escape (A obstruction-registering + Born as overlay + shared A)
  is TRT's own position. NET: OPN-002 stays OPEN, no confidence move; the fork is neither
  decided nor moved. The cross-sector view prices the UNIFICATION; it does not favor
  modified gravity. Highest-leverage next question: is projective Born fundamental to A or
  an overlay? (= the stage-2 keystone itself).
  2026-06-29 (Grok proposal triage; reviews/2026-06-grok/): a categorical recast of TRT
  was DECLINED as a program (re-skins v0.9 hard core; its idempotent-monad decoherence
  centerpiece is the PRD-001 re-description route; ZX/dagger-compact bakes in the inner
  product and tilts to the quadratic horn). One graft EXTRACTED for sub-route 1: a
  SHEAF-COHOMOLOGICAL probe (2-theory/00-foundational/actualization-resolution-sheaf-probe.md).
  Thesis: horn (a) obstruction-registering = the cohomological obstruction class to a global
  section (metric-free, possibilistic layer); horn (b) best-fit projective = nearest-section
  projection under an imposed norm (probabilistic layer). Precedent: Abramsky-Brandenburger
  (2011) sheaf-theoretic contextuality (verify primary first). Priority: OPTIONAL, below the
  live commutant/gravity work; LOW confidence it resolves OPN-002; MEDIUM it is the right CT
  corner. CORRECTION logged: an interim "use ZX as the probe" suggestion was withdrawn —
  ZX carries the inner product (quadratic horn only); sheaf cohomology can carry the
  metric-free obstruction. No confidence move; OPN-002 stays OPEN.
  2026-06-29 (red-team of the sheaf probe; reviews/2026-06-redteam-sheaf/): attacked on 5
  vectors. PRIMARY VERIFIED (A-B 2011 obstruction-to-global-section + possibilistic/probabilistic
  semiring layering — both accurate; logged in verification-status.md; cite the cohomology sequel
  Abramsky-Mansfield-Barbosa). Static mapping (co-admissibility-failure = no-global-section)
  SURVIVES — faithful, already rigorous via relational-graph-test §1. DISCRIMINATING CLAIM DOES
  NOT SURVIVE: OPN-002 is about the deficit's MAGNITUDE functional (|δ| vs δ²/3); the
  possibilistic/metric-free layer is magnitude-free, so the property that keeps horn (a) honest
  cannot separate the horns, and the layer that can (probabilistic) IS horn (b) by definition —
  the γ̇/PRD-001 re-description pattern recurring (UNCERTAIN→REFUTED, MED-HIGH). The sheaf also
  models the OBSTRUCTION, not A's RESOLUTION ACT (register-vs-project sits on top of the sheaf,
  not within it; REFUTED, HIGH). DISPOSITION APPLIED: RE-SCOPED, not killed — thesis demoted from
  "distinguishes the horns natively" to "candidate sharper falsifier"; success criterion sharpened
  (discriminator only if the possibilistic layer alone carries a torsion/higher-H^n feature
  differing by resolution mode; else record NEGATIVE → informative negative toward horn b).
  No confidence move; OPN-002 stays OPEN.
