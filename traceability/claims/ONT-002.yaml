id: ONT-002
name: Three Irreducible Co-Primitives
statement: |
  L₃ (ontological logical constraint), I∞ (unbounded informational
  representability/differentiation), and A (fundamental state transition/change)
  are jointly necessary and irreducible co-primitives for determinate actuality.
  L₃ cannot supply content or transition; I∞ cannot supply its own admissibility
  or transition; A cannot supply its relata or admissibility constraints.
tier: 1
role: primitive
proof_status: verified
epistemic_status: argued
depends_on: []
source_documents:
  - { doc: TRT-v0.10, section: "3, 9" }
risk_if_false: |
  A successful reduction of any primitive to the other two, without explanatory
  loss or smuggling, defeats the irreducibility claim and requires hard-core revision.
notes: Canonical normalization under WP-TRT-CORE-0001. Pair-failure formalized in Lean (formalization/TrtFormalization/Core/Irreducibility.lean, merged 2026-11-12 at 73fa11d1; results note at 05-work-packages/WP-TRT-LRT-ONTO-0001-ultimate-actuality-maximal-perfection/cpit-formalization-results.md), proved relative to the constitutive conditions stated there. General non-definability is not claimed, and the WP-TRT-CORE-0001 A-reduction challenge remains open.
