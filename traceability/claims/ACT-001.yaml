id: ACT-001
name: Primitive Action and Admissibility Preservation
statement: |
  A is fundamental state transition/change, defined without presupposing physical
  time, motion, force, energy, or actuality. Actual states belong to the
  actualizable domain, and every actualizable state satisfies the necessary L₃ filter.
tier: 1
role: bridge
proof_status: axiomatized
epistemic_status: argued
formal_artifacts:
  lean:
    - { file: TrtFormalization/Core/Primitives.lean, symbol: A, status: axiom }
    - { file: TrtFormalization/Core/Primitives.lean, symbol: actual_is_actualizable, status: proven }
    - { file: TrtFormalization/Core/Primitives.lean, symbol: actual_is_l3_admissible, status: proven }
depends_on:
  - { claim_id: ONT-003, dependency_type: formal }
  - { claim_id: LOG-001, dependency_type: formal }
source_documents:
  - { doc: TRT-v0.10, section: "3.3, 3.4" }
risk_if_false: |
  If transition can be eliminated without explanatory loss, A is not irreducible.
  If actual states need not satisfy L₃, the canonical gate fails.
notes: |
  WP-TRT-CORE-0001 separates primitive A from the predicate that a state obtains,
  avoiding the former circular definition of A as "actualizing action."
